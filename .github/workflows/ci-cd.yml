name: CI/CD
on:
  push:
    branches: [main, dev_aula]
  pull_request:
    branches: [main, dev_aula]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Start app + database
        run: docker compose up -d --build
      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health; then
              echo "App is healthy"
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Run tests
        run: npm test
      - name: Stop app + database
        if: always()
        run: docker compose down

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t takazonobruno/task-manager:${{ github.sha }} .
          docker tag takazonobruno/task-manager:${{ github.sha }} takazonobruno/task-manager:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/dev_aula'
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Push Docker image
        run: |
          docker push takazonobruno/task-manager:${{ github.sha }}
          docker push takazonobruno/task-manager:latest
